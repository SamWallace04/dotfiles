$mainMod=SUPER
$shiftMod=$mainMod+SHIFT
$ctrlMod=$mainMod+CONTROL
$altMod=$mainMod+ALT

# You have to change this based on your monitor 
monitor=DP-1,2560x1440@144,0x0,1

workspace=1,monitor:DP-2, default:true

exec-once = qs -c noctalia-shell

# Status bar 
# exec-once=eww open bar
#exec=~/.config/hypr/scripts/statusbar.sh

#Notification 
exec-once=dunst
# Wallpaper
#exec-once=awww-daemon
#exec-once=~/.config/hypr/scripts/randomisewallpaper.sh ~/wallpapers/Cyberpunk/
#exec-once=linux-wallpaperengine --screen-root DP-1 --scaling stretch 3397136701
exec-once=[workspace 2 silent] flatpak run com.github.jagrat7.LinuxWallpaperEngine
# For keyboard 
exec-once=fcitx5 -D

exec-once=wl-paste --watch cliphist store

# Other start up commands
# TODO: Set up a new lock screen
#exec-once=hypridle

exec-once=/usr/lib/polkit-kde-authentication-agent-1

exec-once=[silent] remotemouse
exec-once=[workspace 1 silent] zen-browser
exec-once=[workspace 1 silent] discord
exec-once=[workspace 2 silent] steam
exec-once=[workspace 2 silent] lutris

# Bluetooth
exec-once=blueman-applet 

# Screen Sharing 
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=~/.config/hypr/scripts/screensharing.sh

# Load plugins
exec-once=hyprpm reload -n

# Hyprcursor
exec-once=hyprctl setcursor rose-pine-hyprcursor 24

general {
    layout=scrolling

    gaps_in=8
    gaps_out=10
    border_size=2
    col.active_border = rgba(cba6f7ff) rgba(9399b2ff) 45deg
    col.inactive_border = rgba(313244cc) rgba(585b70cc) 45deg
}

input {
    sensitivity=0 # for mouse cursor
  }

  cursor {
      no_hardware_cursors=true
    }

master {
    orientation=center
    mfact=0.5
}

scrolling {

  }

decoration {
    rounding=20
    rounding_power=2
    shadow {
      enabled=true
        color=rgb(cba6f7)
        color_inactive=rgb(181825)
        range=25
    }
    blur {
        # Your blur "amount" is blur_size * blur_passes, but high blur_size (over around 5-ish) will produce artifacts.
        # if you want heavy blur, you need to up the blur_passes.
        # the more passes, the more you can up the blur_size without noticing artifacts.
        enabled=true
        size=6 # minimum 1
        passes=2 # minimum 1, more passes = more resource intensive.
        new_optimizations = true   
    }
}


# Blur for waybar 
blurls=waybar
blurls=lockscreen

animations {
    enabled=1
    # bezier=overshot,0.05,0.9,0.1,1.1
    bezier=overshot,0.13,0.99,0.29,1.1
    animation=windows,1,4,overshot,popin
    animation=fade,1,10,default
    animation=workspaces,1,6,overshot,slide
    animation=border,1,10,default
}

misc {
  disable_hyprland_logo=true
  disable_splash_rendering=true
  mouse_move_enables_dpms=true
}

#
#Plugin config
#

plugin {
  hy3 {
    autotile {
      enable = true
      trigger_width = 1000
      trigger_height = 500
      }
    }
}

#Window Rules

# Float Necessary Windows
windowrule = match:class ^()$, match:title ^(Picture in picture)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on
windowrule = match:class ^steam$, match:title ^Friends List$, float on
windowrule = match:class ^steam$, match:title ^Steam Settings$, float on

# Increase the opacity 
windowrule=match:class ^(obsidian)$, opacity 0.88,
windowrule=match:class ^(thunar)$, opacity 0.80,

bindm=$shiftMod,mouse:272,movewindow
bindm=$shiftMod,mouse:273,resizewindow

#Keybinds

bind=$mainMod,Q,killactive
bind=$mainMod,F,fullscreen,1
bind=$shiftMod,F,fullscreen,0
bind=$mainMod,RETURN,exec,ghostty +new-window
bind=$shiftMod,C,exec,bash ~/.config/hypr/scripts/reload.sh
bind=$mainMod,D,exec,~/.config/rofi/launchers/type-5/launcher.sh
bind=$mainMod,P,pseudo
bind=$mainMod,ESCAPE,exec,sudo systemctl suspend
bind=$ctrlMod,L,exec, wallock -o lock

bind=$mainMod,M,exec,~/.config/hypr/scripts/changelayoutmode.sh master
bind=$shiftMod,M,exec,~/.config/hypr/scripts/changelayoutmode.sh scrolling
bind=$ctrlMod,M,exec,~/.config/hypr/scripts/changelayoutmode.sh dwindle

bind=$shiftMod,space,togglefloating

# Screenshot a monitor
bind = ,PRINT,exec,hyprshot -m output
# Screenshot a window
bind=$mainMod, PRINT, exec, hyprshot -m window
# Screenshot a region
bind=$shiftMod,PRINT,exec,hyprshot -m region
# Screen recorder
#bind=$mainMod,R,exec,wf-recorder -g "$(slurp)"

# Master layout binds
bind=$shiftMod,RETURN,layoutmsg,swapwithmaster
bind=$ctrlMod,RETURN,layoutmsg,focusmaster
bind=$ctrlMod,j,layoutmsg,rollnext
bind=$ctrlMod,k,layoutmsg,rollprev

# Scrolling layout binds
bind = $mainMod, period, layoutmsg, move +col
bind = $mainMod, comma, layoutmsg, swapcol l
bind = $ctrlMod, f, layoutmsg, focus

bind=$mainMod,j,movefocus,d
bind=$mainMod,k,movefocus,u

bind=$mainMod,h,movefocus,l
bind=$mainMod,l,movefocus,r

bind=$mainMod,left,resizeactive,-40 0
bind=$mainMod,right,resizeactive,40 0

bind=$mainMod,up,resizeactive,0 -40
bind=$mainMod,down,resizeactive,0 40

bind=$shiftMod,h,movewindow,l
bind=$shiftMod,l,movewindow,r
bind=$shiftMod,k,movewindow,u
bind=$shiftMod,j,movewindow,d

bind=$mainMod,1,workspace,1
bind=$mainMod,2,workspace,2
bind=$mainMod,3,workspace,3
bind=$mainMod,4,workspace,4
bind=$mainMod,5,workspace,5
bind=$mainMod,6,workspace,6
bind=$mainMod,7,workspace,7
bind=$mainMod,8,workspace,8
bind=$mainMod,9,workspace,9
bind=$mainMod,0,workspace,10

bind=$shiftMod,1,movetoworkspacesilent,1
bind=$shiftMod,2,movetoworkspacesilent,2
bind=$shiftMod,3,movetoworkspacesilent,3
bind=$shiftMod,4,movetoworkspacesilent,4
bind=$shiftMod,5,movetoworkspacesilent,5
bind=$shiftMod,6,movetoworkspacesilent,6
bind=$shiftMod,7,movetoworkspacesilent,7
bind=$shiftMod,8,movetoworkspacesilent,8
bind=$shiftMod,9,movetoworkspacesilent,9
bind=$shiftMod,0,movetoworkspacesilent,10

bind=$ctrlMod,1,moveworkspacetomonitor,1 current
bind=$ctrlMod,2,moveworkspacetomonitor,2 current
bind=$ctrlMod,3,moveworkspacetomonitor,3 current
bind=$ctrlMod,4,moveworkspacetomonitor,4 current
bind=$ctrlMod,5,moveworkspacetomonitor,5 current
bind=$ctrlMod,6,moveworkspacetomonitor,6 current
bind=$ctrlMod,7,moveworkspacetomonitor,7 current
bind=$ctrlMod,8,moveworkspacetomonitor,8 current
bind=$ctrlMod,9,moveworkspacetomonitor,9 current
bind=$ctrlMod,0,moveworkspacetomonitor,0 current

source = /home/sam/.config/hypr/noctalia/noctalia-colors.conf

