config_version = 14

[bar.default]
auto_hide = true
background_opacity = 0.69999998435378075
capsule = true
end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "session" ]
margin_ends = 1000
reserve_space = false
scale = 1.1500000096857548
start = [ "workspaces", "media" ]
thickness = 40

    [bar.default.monitor.Virtual-1]
    margin_ends = 0
    scale = 1.0000000074505806
    thickness = 20

[control_center]
hidden_tabs = [ "monitor", "power" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@FALLBACK", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 2560.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 5120.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "FALLBACK"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
settings_window_translucent = true

    [shell.panel]
    floating_layer = "top"
    transparency_mode = "glass"

[theme]
builtin = "Gruvbox"
community_palette = "Gruvbox Material"

    [theme.templates]
    builtin_ids = [ "btop", "ghostty", "hyprland", "qt" ]

[widget.clock]
format = "{:%H:%M %a %d-%m}"